<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Traffic Violations M road logo">
  <defs>
    <linearGradient id="asphalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3654"/>
      <stop offset="1" stop-color="#18223B"/>
    </linearGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3EC1D3"/>
      <stop offset="0.5" stop-color="#5BE7C4"/>
      <stop offset="1" stop-color="#9D8DF1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- rounded dark plate with glowing ring -->
  <rect x="14" y="14" width="484" height="484" rx="120" fill="#0C1730"/>
  <rect x="14" y="14" width="484" height="484" rx="120" fill="none" stroke="url(#halo)" stroke-width="6" opacity="0.9"/>

  <!-- soft glow behind the M -->
  <path d="M104 436 L138 108 L256 300 L374 108 L408 436"
        fill="none" stroke="url(#halo)" stroke-width="74"
        stroke-linejoin="round" stroke-linecap="round" opacity="0.18" filter="url(#soft)"/>

  <!-- the road that forms the letter M -->
  <path d="M104 436 L138 108 L256 300 L374 108 L408 436"
        fill="none" stroke="url(#asphalt)" stroke-width="60"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- dashed lane marking down the middle of the road -->
  <path d="M104 436 L138 108 L256 300 L374 108 L408 436"
        fill="none" stroke="#F4D35E" stroke-width="5"
        stroke-linejoin="round" stroke-linecap="round"
        stroke-dasharray="2 26"/>

  <!-- crosswalk stripes at the two road entrances (top of the M) -->
  <g fill="#EAF0FA">
    <g transform="translate(138 108) rotate(-8)">
      <rect x="-26" y="-30" width="9" height="34" rx="3"/>
      <rect x="-11" y="-30" width="9" height="34" rx="3"/>
      <rect x="4"  y="-30" width="9" height="34" rx="3"/>
      <rect x="19" y="-30" width="9" height="34" rx="3"/>
    </g>
    <g transform="translate(374 108) rotate(8)">
      <rect x="-26" y="-30" width="9" height="34" rx="3"/>
      <rect x="-11" y="-30" width="9" height="34" rx="3"/>
      <rect x="4"  y="-30" width="9" height="34" rx="3"/>
      <rect x="19" y="-30" width="9" height="34" rx="3"/>
    </g>
  </g>

  <!-- location pin at the end of the right road leg -->
  <g transform="translate(408 436)">
    <path d="M0 44 C-22 12 -30 -2 -30 -18 A30 30 0 1 1 30 -18 C30 -2 22 12 0 44 Z"
          fill="#E63946"/>
    <circle cx="0" cy="-18" r="12" fill="#0C1730"/>
  </g>

  <!-- little roadside trees at the base of the left leg -->
  <g>
    <g transform="translate(96 452)">
      <rect x="-3" y="6" width="6" height="16" rx="2" fill="#6B4A2B"/>
      <ellipse cx="0" cy="0" rx="16" ry="20" fill="#3EC1D3"/>
    </g>
    <g transform="translate(56 458)">
      <rect x="-3" y="6" width="6" height="14" rx="2" fill="#6B4A2B"/>
      <ellipse cx="0" cy="0" rx="13" ry="17" fill="#5BE7C4"/>
    </g>
  </g>
</svg>
